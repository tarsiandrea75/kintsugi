spring:
  application:
    name: agent
  # The agent's state store: database agent on the knowledge-db instance, as agent_app (ADR-010). Flyway creates the
  # schema as the same role at startup, so the agent starts only when the store is reachable; it does not need Ollama.
  # AGENT_DB_PASSWORD has no default: a missing one stops the start with the variable's name.
  datasource:
    url: jdbc:postgresql://${AGENT_DB_HOST:knowledge-db}:${AGENT_DB_PORT:5432}/agent
    username: agent_app
    password: ${AGENT_DB_PASSWORD}
    hikari:
      maximum-pool-size: 4
      connection-timeout: 2000
  ai:
    # spring.ai.model.chat, which picks the one ChatModel, is not set here: RouteEnvironmentPostProcessor derives it
    # from kintsugi.agent.route (ollama for local, anthropic for cloud), so the route is one input.
    ollama:
      chat:
        model: granite4.1:8b
        temperature: 0
        num-ctx: 8192
    # The cloud route's client (ADR-012), off on the local route. The key comes from the environment only, never from
    # the repository; an empty key on the cloud route stops the start. Its timeout is the cloud route's longest call
    # deadline, call-timeout.report, so the loop's deadline and not the HTTP client ends a call; no retries, since the
    # loop owns retries and their budget.
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      timeout: ${kintsugi.agent.cloud.call-timeout.report}
      max-retries: 0
      chat:
        model: ${kintsugi.agent.cloud.name}
    mcp:
      client:
        # The agent's only way into the lab: one SYNC Streamable HTTP connection to mcp-tools (ADR-010, agent spec).
        type: SYNC
        # Lazy: no initialize handshake at startup, so the agent starts while mcp-tools is down. The MCP client
        # initializes on its first request and tries again on the next one after a failure.
        initialized: false
        request-timeout: 20s
        streamable-http:
          connections:
            kintsugi:
              url: ${KINTSUGI_MCP_URL:http://127.0.0.1:18085}
              endpoint: /mcp
    retry:
      # Connection refused on localhost means the server is down; retrying only delays the error.
      max-attempts: 0
  http:
    clients:
      # The demo's one question: CPU inference with an 8B model can take minutes; this is a cap, not an expectation.
      # The loop does not use it: LoopConfig gives Ollama's client in the web profile its own read timeout, the longest
      # of kintsugi.agent.model.call-timeout.act, .report and kintsugi.agent.loop.warm-up-timeout (agent spec,
      # "Shared rules").
      read-timeout: 5m
      connect-timeout: 2s

kintsugi:
  agent:
    # How the loop gathers its evidence (agent spec, "Dossier mode"; ADR-010, "Amended in T5a"): explorer, the ADR-010
    # loop where the model picks every call from TRIAGE on, or dossier, where code first gathers the evidence dossier
    # (ADR-011), the model reads it before INVESTIGATE and KNOWLEDGE, and TRIAGE is skipped. Recorded on every incident.
    mode: ${KINTSUGI_AGENT_MODE:explorer}
    # Where the model runs (agent spec, "Routes"; ADR-012; ADR-010, "Amended in cloud-route T3"): local, the default,
    # on Ollama with kintsugi.agent.model, or cloud, on Anthropic with kintsugi.agent.cloud. Any other value stops the
    # start. Recorded on every incident with the model.
    route: ${KINTSUGI_AGENT_ROUTE:local}
    # ModelRouter's one route in M2 (ADR-010, ADR-003): ACT and REPORT both go to the local Ollama model, with the
    # same settings as spring.ai.ollama.chat.
    model:
      name: ${spring.ai.ollama.chat.model}
      temperature: ${spring.ai.ollama.chat.temperature}
      num-ctx: ${spring.ai.ollama.chat.num-ctx}
      # The deadline of one call, per task (agent spec, "Budgets"; the human's decisions of 2026-10-14 and 2026-10-16):
      # on the laptop's CPU reading the prompt takes about 70 to 90 s and an answer is written at about 2.9 tokens/s. In
      # the third full run a REPORT call ran past 300 s. In runs 11-13 a phase's first ACT answer, which carries the
      # plan, took 213-300 s and caused every F1 timeout, while the other ACT answers stayed under 175 s; most of that
      # time is reading the prompt (each phase starts from a fresh plan), so a shorter answer would save little.
      call-timeout:
        act: 420s
        report: 420s
      # The most tokens an answer may hold, Ollama's num_predict (agent spec, "Answer caps", where the values are
      # justified). On the laptop's CPU an answer is written at about 3 tokens/s, so a cap also bounds the call's time:
      # a phase's first ACT answer carries the plan and its tool calls, a later one only tool calls, the report is JSON.
      num-predict:
        first-act: 384
        act: 160
        report: 512
    # The cloud route (ADR-012): claude-haiku-5-5, with the answer caps of kintsugi.agent.model.num-predict and its own
    # call deadlines, a first guess to be measured in cloud-route T5. The report is the longer one, and
    # spring.ai.anthropic.timeout follows it.
    cloud:
      name: claude-haiku-5-5
      call-timeout:
        act: 60s
        report: 90s
    # The run's budgets (agent spec, "Budgets"); the 8 tool calls and the phases' allowances are fixed in code. A valid
    # run makes at most 15 model calls (8 ACT answers, 2 for uncounted refusals, 3 phase retries and 2 report
    # attempts), so 15 is a guard against a loop bug; the warm-up, which loads the
    # model before the run, counts against no budget and has its own bound. 45 min holds every incident measured (the
    # longest took 1915 s), but not a run with every model call at its deadline (6 ACT answers and 2 reports at 420 s,
    # 56 min): a recorded follow-up.
    loop:
      max-model-calls: 15
      incident-timeout: 45m
      warm-up-timeout: 300s

server:
  port: 8086
