schema: spec-driven

context: |
  Project: kintsugi (greenfield; only docs/ exists, nothing implemented yet).
  Purpose: local-first AI agent that diagnoses incidents in a microservices lab;
  a fault injector records ground truth; benchmarks small local models vs frontier APIs.
  Planned stack (docs/vision.md): Java 21, Spring Boot, Spring AI, MCP server,
  PostgreSQL + pgvector, Ollama/API via ModelRouter, OTel/Prometheus/Loki/Grafana;
  Python (pandas, matplotlib) for evals only.
  Rule: LLM proposes, deterministic code verifies, policy authorizes.
  docs/vision.md is the source of truth; contradictions go to the human. Conventional commits.

strict_tdd: false  # no test runner yet; the first code change must bootstrap test tooling, then switch to true

testing:
  strict_tdd_requested: true
  runner:
    command: null
    framework: null  # planned: JUnit 5 (Java), pytest (evals)
  layers:
    unit: false
    integration: false
    e2e: false
  coverage:
    available: false
    command: null
  quality:
    linter: false
    type_checker: false
    formatter: false

rules:
  proposal:
    - Reference docs/vision.md; flag any contradiction to the human instead of resolving it.
  specs:
    - Use Given/When/Then scenarios with RFC 2119 keywords.
  design:
    - Respect "LLM proposes, deterministic code verifies, policy authorizes".
  tasks:
    - Keep each work unit within the review budget (400 lines).
    - The first code change must include test tooling bootstrap (JUnit 5, pytest). Docs-only changes are exempt.
  apply:
    - Follow TDD once a test runner exists.
  verify:
    - Run the detected test runner; report unavailable capabilities explicitly.
  archive:
    - Merge delta specs into openspec/specs before archiving.
