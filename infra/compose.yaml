# Kintsugi M1 lab: PostgreSQL, the four services and the observability stack (ADR-007, ADR-008).
#
#   docker compose -f infra/compose.yaml up -d --build --wait
#   docker compose -f infra/compose.yaml down -v
#
# Host ports (ADR-008): order-service 18080, payment-service 18081, gateway-mock 18082, inventory-service 18083,
# Grafana 13000 (dashboard "Lab — Faults"), Prometheus 19090. Every port is bound to 127.0.0.1 only.
# Grafana's admin password comes from GRAFANA_ADMIN_PASSWORD (see infra/.env.example).
# PostgreSQL, Loki and Alloy are not published on the host; containers reach each other by service name.
name: kintsugi-lab

services:
  postgres:
    image: postgres:18.6
    environment:
      # Lab-only credentials; nothing here is a secret.
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: during init the server listens only on the Unix socket, so this passes once the databases exist.
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "lab", "-d", "payments"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 30s

  gateway-mock:
    build: ../lab/gateway-mock
    ports:
      - "127.0.0.1:18082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s

  payment-service:
    build: ../lab/payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payments
      SPRING_DATASOURCE_USERNAME: lab
      SPRING_DATASOURCE_PASSWORD: lab
      KINTSUGI_GATEWAY_BASEURL: http://gateway-mock:8082
    ports:
      - "127.0.0.1:18081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      gateway-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s

  inventory-service:
    build: ../lab/inventory-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
      SPRING_DATASOURCE_USERNAME: lab
      SPRING_DATASOURCE_PASSWORD: lab
      # Fault F4 (DB pool exhausted) sets INVENTORY_POOL_SIZE=2 and INVENTORY_RESERVATION_DELAY=5s, then recreates
      # this service; see verify-f4.sh. The delay is a lab-only fault hook that holds a pooled connection.
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: ${INVENTORY_POOL_SIZE:-10}
      KINTSUGI_INVENTORY_RESERVATIONDELAY: ${INVENTORY_RESERVATION_DELAY:-0s}
    ports:
      - "127.0.0.1:18083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s

  order-service:
    build: ../lab/order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: lab
      SPRING_DATASOURCE_PASSWORD: lab
      # Fault F3 (wrong configuration) sets ORDER_PAYMENT_BASEURL to a port where nothing listens; see verify-f3.sh.
      KINTSUGI_PAYMENT_BASEURL: ${ORDER_PAYMENT_BASEURL:-http://payment-service:8081}
      KINTSUGI_INVENTORY_BASEURL: http://inventory-service:8083
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 2s

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    # No healthcheck: the image is distroless, with no shell, wget or curl. Readiness is /ready on port 3100.

  alloy:
    image: grafana/alloy:v1.20.1
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Alloy only lists containers and reads their logs, but ":ro" does not limit the API: the socket gives full
      # Docker API control, which is root-equivalent on the host. Accepted for a local, loopback-only lab (ADR-008).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    healthcheck:
      # The image has bash but no wget or curl; /-/ready answers 200 once the config is loaded.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 2s

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      # Lab only: anyone can view, nobody needs to log in. Editing needs the admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-kintsugi-lab}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lab-f1.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
