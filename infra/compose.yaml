# Kintsugi lab: PostgreSQL, the four services, the fault injector, the observability stack and mcp-tools, the agent's
# tools (ADR-007, ADR-008, ADR-009, ADR-004).
#
#   export KINTSUGI_REPO_DIR="$(git rev-parse --show-toplevel)" DOCKER_GID="$(stat -c %g /var/run/docker.sock)"
#   docker compose -f infra/compose.yaml up -d --build --wait
#   docker compose -f infra/compose.yaml down -v
#
# Host ports (ADR-008): order-service 18080, payment-service 18081, gateway-mock 18082, inventory-service 18083,
# fault-injector 18084, mcp-tools 18085 (MCP on /mcp), Grafana 13000 (dashboard "Lab — Faults"), Prometheus 19090.
# Every port is bound to 127.0.0.1.
# PostgreSQL, Loki and Alloy are not published on the host; containers reach each other by service name.
#
# Variables (lab defaults; see infra/.env.example). Put overrides in infra/.env rather than in the shell: the fault
# injector recreates services from this same file and reads infra/.env too, but never sees the host shell.
# - KINTSUGI_REPO_DIR: absolute host path of the repository, mounted read-only at that same path into fault-injector.
#   Defaults to $PWD, which is right when compose runs from the repository root.
# - DOCKER_GID: group id of /var/run/docker.sock on the host, added to fault-injector. Required, with no default: a
#   wrong gid would start an injector that cannot reach Docker, so compose refuses to run without it.
# - POSTGRES_BOOTSTRAP_PASSWORD, LAB_APP_DB_PASSWORD, FAULTS_DB_PASSWORD, KINTSUGI_AGENT_DB_PASSWORD: database
#   passwords. They are applied only when the postgres volume is empty, so changing them needs a "down -v".
# - GRAFANA_ADMIN_PASSWORD: Grafana's admin password.
name: kintsugi-lab

services:
  postgres:
    image: postgres:18.6
    environment:
      # Lab-only credentials; nothing here is a secret. The bootstrap superuser is used only by the init script, which
      # creates the non-superuser roles lab_app (the services) and faults (the fault injector); see
      # postgres/init/01-roles-and-databases.sh and ADR-009.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-postgres}
      LAB_APP_DB_PASSWORD: ${LAB_APP_DB_PASSWORD:-lab_app}
      FAULTS_DB_PASSWORD: ${FAULTS_DB_PASSWORD:-faults}
      KINTSUGI_AGENT_DB_PASSWORD: ${KINTSUGI_AGENT_DB_PASSWORD:-kintsugi_agent}
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: during init the server listens only on the Unix socket, so this passes once the databases exist.
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "lab_app", "-d", "payments"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 30s

  gateway-mock:
    build: ../lab/gateway-mock
    ports:
      - "127.0.0.1:18082:8082"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s

  payment-service:
    build: ../lab/payment-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/payments
      SPRING_DATASOURCE_USERNAME: lab_app
      SPRING_DATASOURCE_PASSWORD: ${LAB_APP_DB_PASSWORD:-lab_app}
      KINTSUGI_GATEWAY_BASEURL: http://gateway-mock:8082
    ports:
      - "127.0.0.1:18081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      gateway-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s

  inventory-service:
    build: ../lab/inventory-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/inventory
      SPRING_DATASOURCE_USERNAME: lab_app
      SPRING_DATASOURCE_PASSWORD: ${LAB_APP_DB_PASSWORD:-lab_app}
      # Fault F4 (DB pool exhausted): fault-injector recreates this service with INVENTORY_POOL_SIZE=2 and
      # INVENTORY_RESERVATION_DELAY=5s. The delay is a lab-only fault hook that holds a pooled connection.
      SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: ${INVENTORY_POOL_SIZE:-10}
      KINTSUGI_INVENTORY_RESERVATIONDELAY: ${INVENTORY_RESERVATION_DELAY:-0s}
    ports:
      - "127.0.0.1:18083:8083"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s

  order-service:
    build: ../lab/order-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/orders
      SPRING_DATASOURCE_USERNAME: lab_app
      SPRING_DATASOURCE_PASSWORD: ${LAB_APP_DB_PASSWORD:-lab_app}
      # Fault F3 (wrong configuration): fault-injector recreates this service with ORDER_PAYMENT_BASEURL pointing at a
      # port where nothing listens.
      KINTSUGI_PAYMENT_BASEURL: ${ORDER_PAYMENT_BASEURL:-http://payment-service:8081}
      KINTSUGI_INVENTORY_BASEURL: http://inventory-service:8083
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s

  # The fault injector (ADR-009): activates a catalog fault, records its true cause in the faults database, and restores
  # the lab. F1 and F2 go through gateway-mock's admin API; F3 and F4 recreate one service with
  # "docker compose ... up -d --no-deps --no-build --wait <service>", so it never recreates itself or the whole stack.
  # It is invisible to the agent's data sources: Alloy drops its logs and Prometheus does not scrape it.
  fault-injector:
    build: ../lab/fault-injector
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/faults
      SPRING_DATASOURCE_USERNAME: faults
      SPRING_DATASOURCE_PASSWORD: ${FAULTS_DB_PASSWORD:-faults}
      KINTSUGI_LABCONTROL_MODE: docker
      KINTSUGI_LABCONTROL_COMPOSEFILE: ${KINTSUGI_REPO_DIR:-$PWD}/infra/compose.yaml
      KINTSUGI_LABCONTROL_GATEWAYBASEURL: http://gateway-mock:8082
      # Passed on to the injector's compose CLI, which interpolates this whole file and needs it like any other run.
      DOCKER_GID: ${DOCKER_GID:?set DOCKER_GID to the gid of /var/run/docker.sock}
    # The image runs as an unprivileged user; membership of the socket's group is what lets it use Docker. Like the
    # socket mount for Alloy, this is root-equivalent on the host, accepted for a loopback-only lab (ADR-008, ADR-009).
    group_add:
      - "${DOCKER_GID:?set DOCKER_GID to the gid of /var/run/docker.sock}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The repository, read-only, at its host path: compose resolves this file's relative bind mounts against its own
      # directory, and the Docker daemon reads those resolved paths on the host. The path must already exist.
      - type: bind
        source: ${KINTSUGI_REPO_DIR:-$PWD}
        target: ${KINTSUGI_REPO_DIR:-$PWD}
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:18084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8084/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s

  # The agent's tools over MCP (ADR-004): read-only tools on Loki, Prometheus and the lab databases, as the read-only
  # role kintsugi_agent. Streamable HTTP in STATELESS mode on /mcp; the agent reaches it as mcp-tools:8085. It accepts
  # no Origin header and only the Host values in KINTSUGI_MCP_ALLOWEDHOSTS. Alloy ships its logs (the tool-call
  # records) like any lab service's, but no tool can select them; Prometheus does not scrape it.
  mcp-tools:
    build: ../mcp-tools
    environment:
      SPRING_AI_MCP_SERVER_PROTOCOL: STATELESS
      KINTSUGI_MCP_LOKI_BASEURL: http://loki:3100
      KINTSUGI_MCP_PROMETHEUS_BASEURL: http://prometheus:9090
      KINTSUGI_MCP_POSTGRES_HOST: postgres
      KINTSUGI_MCP_POSTGRES_PORT: "5432"
      KINTSUGI_AGENT_DB_PASSWORD: ${KINTSUGI_AGENT_DB_PASSWORD:-kintsugi_agent}
      KINTSUGI_MCP_ALLOWEDHOSTS: mcp-tools:8085,localhost:18085,127.0.0.1:18085
    ports:
      - "127.0.0.1:18085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8085/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 2s

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    # No healthcheck: the image is distroless, with no shell, wget or curl. Readiness is /ready on port 3100.

  alloy:
    image: grafana/alloy:v1.20.1
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Alloy only lists containers and reads their logs, but ":ro" does not limit the API: the socket gives full
      # Docker API control, which is root-equivalent on the host. Accepted for a local, loopback-only lab (ADR-008).
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    healthcheck:
      # The image has bash but no wget or curl; /-/ready answers 200 once the config is loaded.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
      start_interval: 2s

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      # Lab only: anyone can view, nobody needs to log in. Editing needs the admin login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-kintsugi-lab}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lab-f1.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s
      start_interval: 2s

volumes:
  postgres-data:
  prometheus-data:
  loki-data:
