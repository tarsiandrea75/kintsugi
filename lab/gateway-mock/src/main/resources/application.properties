spring.application.name=gateway-mock

# payment-service runs on 8081 and calls this gateway at http://localhost:8082 by default (kintsugi.gateway.base-url).
server.port=8082

# Sleeping /authorize requests park virtual threads instead of holding Tomcat's 200 platform threads, so the admin API stays reachable during fault F1.
spring.threads.virtual.enabled=true

# Prometheus scrapes /actuator/prometheus; health stays exposed for healthchecks (ADR-008).
management.endpoints.web.exposure.include=health,prometheus
