spring.application.name=fault-injector

# Lab services use 8080-8083; the injector API listens on 8084 (published on 127.0.0.1:18084).
server.port=8084

# The Host values the API accepts (fault-injector spec, "Browser requests are rejected"; ADR-004): any other answers
# 421, and any request with an Origin header answers 403. fault-injector:8084 is the compose name, localhost:8084 the
# compose healthcheck inside the container, localhost:18084 and 127.0.0.1:18084 the host (infra/scripts). A new
# service name or port needs this list changed too. An empty list stops the start.
kintsugi.fault-injector.allowed-hosts=fault-injector:8084,localhost:8084,localhost:18084,127.0.0.1:18084

# Exposed like the other services for consistency. Prometheus does not scrape this service, so the
# injector stays invisible to the agent's metrics (ADR-009).
management.endpoints.web.exposure.include=health,prometheus

# How the injector acts on the lab (dev.kintsugi.lab.fault.control.LabControl):
# - "docker": the real control. F1 and F2 call gateway-mock's admin API; F3 and F4 recreate the target service with
#   "docker compose ... up -d --no-deps --no-build --wait --wait-timeout <N> <service>" through the mounted Docker
#   socket (ADR-009). The compose deployment sets this mode and the compose file.
# - "unsupported" (default, used by the tests and a bare "java -jar"): the application starts, and every activation
#   fails before touching the lab and is recorded as FAILED.
kintsugi.lab-control.mode=unsupported
# Settings of the "docker" mode, with their defaults. compose-file has no default and is required in that mode: it must
# be the lab's infra/compose.yaml, mounted at its host path (compose resolves relative bind mounts against it, and the
# Docker daemon reads those paths on the host).
#kintsugi.lab-control.gateway-base-url=http://gateway-mock:8082
#kintsugi.lab-control.gateway-connect-timeout=2s
#kintsugi.lab-control.gateway-read-timeout=5s
#kintsugi.lab-control.compose-file=/abs/host/path/infra/compose.yaml
#kintsugi.lab-control.compose-project=kintsugi-lab
#kintsugi.lab-control.recreate-wait-timeout=120s
