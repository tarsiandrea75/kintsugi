spring.application.name=fault-injector

# Lab services use 8080-8083; the injector API listens on 8084 (published on 127.0.0.1:18084).
server.port=8084

# Exposed like the other services for consistency. Prometheus does not scrape this service, so the
# injector stays invisible to the agent's metrics (ADR-009).
management.endpoints.web.exposure.include=health,prometheus

# How the injector acts on the lab (dev.kintsugi.lab.fault.control.LabControl). Until T4 adds the real implementation
# (gateway-mock admin API for F1 and F2, a bounded compose recreate for F3 and F4), the only mode is "unsupported": the
# application starts, and every activation fails before touching the lab and is recorded as FAILED.
kintsugi.lab-control.mode=unsupported
