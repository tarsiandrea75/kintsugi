spring.application.name=order-service

# Connection pool size is set explicitly: the fault injector shrinks it to simulate pool exhaustion.
spring.datasource.hikari.maximum-pool-size=10

# payment-service client (dev.kintsugi.lab.order.payment.PaymentProperties). The fault injector overrides these.
# Defaults: base-url http://localhost:8081, connect-timeout 1s, read-timeout 3s.
#kintsugi.payment.base-url=http://localhost:8081
#kintsugi.payment.connect-timeout=1s
#kintsugi.payment.read-timeout=3s

# Prometheus scrapes /actuator/prometheus; health stays exposed for healthchecks (ADR-008).
management.endpoints.web.exposure.include=health,prometheus
