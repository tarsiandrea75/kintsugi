spring.application.name=payment-service

# Connection pool size is set explicitly: the fault injector shrinks it to simulate pool exhaustion.
spring.datasource.hikari.maximum-pool-size=10

# order-service runs on 8080 and calls this service at http://localhost:8081 by default (kintsugi.payment.base-url).
server.port=8081

# gateway-mock client (dev.kintsugi.lab.payment.gateway.GatewayProperties). The fault injector overrides these.
# Defaults: base-url http://localhost:8082, connect-timeout 1s, read-timeout 15s.
#kintsugi.gateway.base-url=http://localhost:8082
#kintsugi.gateway.connect-timeout=1s
#kintsugi.gateway.read-timeout=15s
