spring.application.name=inventory-service

# Connection pool, set explicitly because fault F4 shrinks it: compose passes INVENTORY_POOL_SIZE as
# SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE. The connection timeout (ms) is short on purpose, so a request that finds
# no free connection fails with a 500 within 2 s instead of queueing for the 30 s default.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=2000

# Lab-only fault hook (dev.kintsugi.lab.inventory.application.InventoryProperties): every reservation waits this long
# on the database while holding a connection. Default 0s; F4 sets it through INVENTORY_RESERVATION_DELAY.
#kintsugi.inventory.reservation-delay=0s

# order-service calls this service at http://localhost:8083 by default (kintsugi.inventory.base-url).
server.port=8083

# Prometheus scrapes /actuator/prometheus; health stays exposed for healthchecks (ADR-008).
management.endpoints.web.exposure.include=health,prometheus
