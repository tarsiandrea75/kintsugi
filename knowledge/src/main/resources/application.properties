spring.application.name=knowledge

# A one-shot job (ADR-002): no web server, it indexes the runbooks and exits with the run's outcome.
spring.main.web-application-type=none
spring.main.banner-mode=off

# Embeddings only, from the local Ollama; the Ollama starter's chat model is switched off.
spring.ai.model.chat=none
spring.ai.model.embedding=ollama
# Compose sets the address its containers reach Ollama on (T5 of the feature).
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=${kintsugi.knowledge.model.name}
# CPU embedding of a whole runbook can take a while; this is a cap, not an expectation (as in ADR-006).
spring.http.clients.read-timeout=5m
spring.http.clients.connect-timeout=2s

# The embedding model (knowledge-base spec). The prefixes keep Nomic's defaults from KnowledgeProperties
# ("search_document: " and "search_query: "), whose trailing space is significant and easy to lose in this file.
kintsugi.knowledge.model.name=nomic-embed-text
kintsugi.knowledge.model.dimensions=768
# The read-only mount of docs/runbooks/; only its top-level *.md files are read.
kintsugi.knowledge.runbooks-dir=/runbooks

# The knowledge store, as its owner role. Compose service name; tests point it at a container.
spring.datasource.url=jdbc:postgresql://knowledge-db:5432/knowledge
spring.datasource.username=knowledge_indexer
# No default: the password comes only from the environment (compose sets KNOWLEDGE_INDEXER_DB_PASSWORD).
spring.datasource.password=${KNOWLEDGE_INDEXER_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=5000
