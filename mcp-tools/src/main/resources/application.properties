spring.application.name=mcp-tools

# MCP server (ADR-004): Streamable HTTP in STATELESS mode on /mcp. The tools need no server-to-client notifications,
# so no session state is kept between requests.
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.name=mcp-tools
# Filled from the pom's <version> by Maven resource filtering (spring-boot-starter-parent filters application*.properties
# with @...@ delimiters), so the version reported to MCP clients cannot drift from the build.
spring.ai.mcp.server.version=@project.version@
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# Compose publishes this port only on 127.0.0.1:18085; the agent reaches it by service name.
server.port=8085

# Prometheus scrapes /actuator/prometheus; health stays exposed for healthchecks (ADR-008).
management.endpoints.web.exposure.include=health,prometheus
