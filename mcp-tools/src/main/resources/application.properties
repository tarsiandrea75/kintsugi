spring.application.name=mcp-tools

# MCP server (ADR-004): Streamable HTTP in STATELESS mode on /mcp. The tools need no server-to-client notifications,
# so no session state is kept between requests.
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.name=mcp-tools
# Filled from the pom's <version> by Maven resource filtering (spring-boot-starter-parent filters application*.properties
# with @...@ delimiters), so the version reported to MCP clients cannot drift from the build.
spring.ai.mcp.server.version=@project.version@
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
# Host values /mcp accepts (421 otherwise): the agent on the compose network, and the host's published port.
kintsugi.mcp.allowed-hosts=mcp-tools:8085,localhost:18085,127.0.0.1:18085

# Compose publishes this port only on 127.0.0.1:18085; the agent reaches it by service name.
server.port=8085

# Prometheus scrapes /actuator/prometheus; health stays exposed for healthchecks (ADR-008).
management.endpoints.web.exposure.include=health,prometheus
# No database health indicator: mcp-tools is up when it can answer tool calls. When PostgreSQL is down, the event and
# summary tools answer UPSTREAM_ERROR and the log and metric tools still work, so the outage is evidence the agent
# reads, not a reason to report the whole service DOWN (and fail its compose healthcheck).
management.health.db.enabled=false

# Backends of the observability tools (ADR-004). Compose service names; tests point them at fake servers.
kintsugi.mcp.loki.base-url=http://loki:3100
kintsugi.mcp.loki.connect-timeout=2s
kintsugi.mcp.loki.read-timeout=5s
kintsugi.mcp.prometheus.base-url=http://prometheus:9090
kintsugi.mcp.prometheus.connect-timeout=2s
kintsugi.mcp.prometheus.read-timeout=5s

# Lab databases of the event and summary tools (ADR-004): one read-only pool per database (orders, payments,
# inventory; the names are fixed in code), all as kintsugi_agent. Compose service name; tests point it at a container.
kintsugi.mcp.postgres.host=postgres
kintsugi.mcp.postgres.port=5432
kintsugi.mcp.postgres.username=kintsugi_agent
# No default: the password comes only from the environment (compose sets KINTSUGI_AGENT_DB_PASSWORD), and the
# application refuses to start while it is empty.
kintsugi.mcp.postgres.password=${KINTSUGI_AGENT_DB_PASSWORD:}
kintsugi.mcp.postgres.connection-timeout=2s
kintsugi.mcp.postgres.maximum-pool-size=2
